global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # EVENT_HORIZON main application
  - job_name: 'event-horizon'
    static_configs:
      - targets: ['event-horizon:8080']
    scrape_interval: 10s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis metrics (if redis_exporter is added)
  - job_name: 'redis'
    static_configs:
      - targets: ['event-horizon-redis:6379']
    scrape_interval: 30s

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s

  # Mock target service
  - job_name: 'mock-target'
    static_configs:
      - targets: ['mock-target:9000']
    scrape_interval: 15s

  # Node exporter (if added for system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
