version: '3.8'

services:
  # EVENT_HORIZON Main Application
  event-horizon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: event-horizon
    ports:
      - "8000:8000"  # Main application
      - "8080:8080"  # Metrics endpoint
    environment:
      - PYTHONPATH=/app
      - EVENT_HORIZON_ENV=docker
      - LOG_LEVEL=INFO
      - PROMETHEUS_PORT=8080
    volumes:
      - ../config:/app/config:ro
      - ../scenarios:/app/scenarios:ro
      - ../logs:/app/logs
      - ./data:/app/data
    networks:
      - event-horizon-net
    restart: unless-stopped
    depends_on:
      - redis
      - prometheus
      - grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: event-horizon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - event-horizon-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: event-horizon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - event-horizon-net
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: event-horizon-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=eventhorizon123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - event-horizon-net
    restart: unless-stopped
    depends_on:
      - prometheus

  # Mock Target Service for Testing
  mock-target:
    build:
      context: ./mock-target
      dockerfile: Dockerfile
    container_name: event-horizon-mock-target
    ports:
      - "9000:9000"
    environment:
      - MOCK_SERVICE_PORT=9000
      - LOG_LEVEL=INFO
    networks:
      - event-horizon-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: event-horizon-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - event-horizon-net
    restart: unless-stopped
    depends_on:
      - event-horizon
      - grafana

  # Jaeger for distributed tracing (Optional)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: event-horizon-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - event-horizon-net
    restart: unless-stopped

  # Loki for log aggregation (Optional)
  loki:
    image: grafana/loki:latest
    container_name: event-horizon-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - event-horizon-net
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  event-horizon-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
