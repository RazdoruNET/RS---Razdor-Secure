version: '3.8'

services:
  dvwa:
    image: vulnerables/web-dvwa
    container_name: prophecy-sentinel-dvwa
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
      - MYSQL_DATABASE=dvwa
      - RECAPTCHA_DISABLE=true
    depends_on:
      - mysql
    networks:
      - prophecy-sentinel-network
    restart: unless-stopped

  mysql:
    image: mysql:5.7
    container_name: prophecy-sentinel-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - prophecy-sentinel-network
    restart: unless-stopped

networks:
  prophecy-sentinel-network:
    driver: bridge

volumes:
  mysql-data:
