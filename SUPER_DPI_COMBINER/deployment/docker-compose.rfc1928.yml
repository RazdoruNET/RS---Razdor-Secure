version: '3.8'

services:
  dpi-socks5-rfc1928:
    build:
      context: .
      dockerfile: Dockerfile.rfc1928
    container_name: dpi-socks5-rfc1928
    restart: unless-stopped
    
    # Стандартный bridge-режим с ручным пробросом портов
    ports:
      - "1080:1080"  # SOCKS5 Порт
      - "8080:8080"  # Web GUI Port
    
    # Принудительные DNS для Docker Desktop
    dns:
      - 8.8.8.8
      - 1.1.1.1
    
    # Нативный macOS-совместимый сетевой шлюз для обхода изоляции Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    environment:
      - LISTEN_PORT=1080
      - PIPELINE_ORDER=fake_packet,sni_modifier,jitter_fragmentation
      - SELECTIVE_THRESHOLD=3000
      - SMART_FAILOVER_ENABLED=true
      - MAX_MUTATION_ATTEMPTS=4
      - DPI_SANDBOX_INSPECTION=true
      - MATRIX_EXPORT_PATH=/app/logs/matrix_report.json
      - WEB_GUI_ENABLED=true
      - WEB_GUI_PORT=8080
      - STRATEGY_PRESEED_URL=githubusercontent.com
      - FAKE_PACKET_BYTES=0x160301000500000000

      - MIN_CHUNK_SIZE=50
      - MAX_CHUNK_SIZE=300
      - MIN_CHUNK_DELAY=0.001
      - MAX_CHUNK_DELAY=0.003
      - CASE_MODIFY_PROBABILITY=0.7
      - LOG_LEVEL=INFO
    
    volumes:
      - ./logs:/app/logs
