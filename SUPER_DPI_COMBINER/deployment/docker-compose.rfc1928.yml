version: '3.8'

services:
  dpi-socks5-rfc1928:
    build:
      context: .
      dockerfile: Dockerfile.rfc1928
    container_name: dpi-socks5-rfc1928
    restart: unless-stopped
    
    # Стандартный проброс портов (без host networking)
    ports:
      - "1080:1080"
    
    # Переменные окружения для конфигурации
    environment:
      - LISTEN_PORT=1080
      - CHUNK_SIZE=250
      - CHUNK_DELAY=0.002
      - LOG_LEVEL=INFO
    
    # Логи в stdout для docker logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Лимиты ресурсов
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
