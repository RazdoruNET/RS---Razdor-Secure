version: '3.8'

services:
  dpi-socks5-rfc1928:
    build:
      context: .
      dockerfile: Dockerfile.rfc1928
    container_name: dpi-socks5-rfc1928
    restart: unless-stopped
    
    # Стандартный проброс портов (без host networking)
    ports:
      - "1080:1080"
    
    # Переменные окружения для конфигурации
    environment:
      - LISTEN_PORT=1080
      - PIPELINE_ORDER=fake_packet,jitter_fragmentation
      - SELECTIVE_THRESHOLD=3000
      # Smart Failover Orchestrator settings
      - SMART_FAILOVER_ENABLED=true
      - MAX_MUTATION_ATTEMPTS=4
      # Настройки для модуля fake_packet
      - FAKE_PACKET_BYTES=0x160301000500000000
      # Настройки для модуля jitter_fragmentation (breaking parameters)
      - MIN_CHUNK_SIZE=40
      - MAX_CHUNK_SIZE=150
      - MIN_CHUNK_DELAY=0.100
      - MAX_CHUNK_DELAY=0.150
      # Настройки для модуля sni_modifier
      - CASE_MODIFY_PROBABILITY=0.7
      - LOG_LEVEL=INFO
    
    # Логи в stdout для docker logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Лимиты ресурсов
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
